<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinancePro - GBP Expense Tracker</title>
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5; --sidebar-bg: #ffffff; --card-bg: #ffffff; --text-color: #1a1a1a;
            --primary: #2ecc71; --secondary: #3498db; --accent: #9b59b6; --sub-color: #f39c12; --border-radius: 12px;
        }
        .theme-dark { --bg-color: #121212; --sidebar-bg: #1e1e1e; --card-bg: #2d2d2d; --text-color: #f0f2f5; --primary: #00ff88; --secondary: #00d4ff; }
        .theme-glass { --bg-color: #6366f1; --sidebar-bg: rgba(255,255,255,0.2); --card-bg: rgba(255,255,255,0.15); --text-color: #ffffff; --primary: #ffffff; --secondary: #e0e7ff; }
        .theme-nord { --bg-color: #2e3440; --sidebar-bg: #3b4252; --card-bg: #434c5e; --text-color: #eceff4; --primary: #88c0d0; --secondary: #81a1c1; }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }
        .sidebar { width: 220px; background: var(--sidebar-bg); border-right: 1px solid rgba(0,0,0,0.1); display: flex; flex-direction: column; padding: 20px; backdrop-filter: blur(10px); }
        .sidebar h2 { color: var(--primary); margin-bottom: 30px; }
        .nav-btn { background: none; border: none; color: var(--text-color); padding: 15px; text-align: left; cursor: pointer; border-radius: 8px; font-weight: bold; margin-bottom: 5px; }
        .nav-btn.active { background: var(--primary); color: white; }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; scroll-behavior: smooth; }
        .tab-content { display: none; width: 100%; max-width: 900px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); padding: 20px; border-radius: var(--border-radius); box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; position: relative; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full-width { grid-column: span 2; }

        input, select { width: 100%; padding: 10px; border: 1px solid rgba(128,128,128,0.3); border-radius: 6px; background: var(--card-bg); color: var(--text-color); box-sizing: border-box; }

        .btn-action { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; margin-top: 10px; }

        .hero-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .hero-bar { color: white; padding: 20px; border-radius: 15px; text-align: center; position: relative; }
        .hero-bar h1 { margin: 5px 0 0 0; font-size: 1.8rem; }

        /* VIEW TOGGLES & TABLES */
        .view-toggles { display: flex; gap: 10px; margin-bottom: 15px; }
        .view-btn { flex: 1; padding: 10px; border: 2px solid var(--accent); background: transparent; color: var(--text-color); border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .view-btn:hover { background: rgba(155, 89, 182, 0.1); }
        .view-btn.active { background: var(--accent); color: white; }

        table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: var(--border-radius); overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(128,128,128,0.2); }
        th { background: rgba(128,128,128,0.1); font-weight: bold; }

        /* BUTTONS */
        .download-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 35px; height: 35px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: 0.2s; z-index: 10; }
        .download-btn:hover { background: rgba(255,255,255,0.4); transform: scale(1.1); }

        .progress-container { background: rgba(0,0,0,0.1); height: 12px; border-radius: 6px; overflow: hidden; margin: 15px 0; border: 1px solid rgba(0,0,0,0.05); }
        .progress-fill { background: linear-gradient(90deg, var(--primary), var(--secondary)); height: 100%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); width: 0%; }

        .paid-btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.75rem; }
        .del-btn { background: #ff4757; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }
        .edit-link { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--secondary); cursor: pointer; font-size: 0.75rem; font-weight: bold; }

        .theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin-top: 15px; }
        .theme-card { padding: 20px; border-radius: 10px; cursor: pointer; text-align: center; font-weight: bold; border: 2px solid rgba(0,0,0,0.05); }

        .bg-danger-card { background: #e74c3c; } 
        .bg-accent { background: var(--accent); }
        .bg-sub { background: var(--sub-color); }
        .bg-secondary { background: var(--secondary); }

        @media print {
            .sidebar, .btn-action, .download-btn, .del-btn, .edit-link, input, select, .theme-grid, h3, label, .view-toggles { display: none !important; }
            .main-content { padding: 0; background: white !important; }
            .card { box-shadow: none !important; border: 1px solid #eee !important; background: white !important; color: black !important; }
            .hero-bar, .bg-danger-card { color: black !important; border: 2px solid #333 !important; background: transparent !important; }
            .hero-bar h1, .bg-danger-card h1 { color: black !important; }
            .progress-container { border: 1px solid #000 !important; }
            .progress-fill { background: #333 !important; }
            body { background: white !important; color: black !important; }
            #emi-cards-display { display: block !important; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>FinancePro</h2>
        <button class="nav-btn active" onclick="switchTab('dashboard-tab', this)">🏠 Dashboard</button>
        <button class="nav-btn" onclick="switchTab('emi-tab', this)">📊 EMI Tracker</button>
        <button class="nav-btn" onclick="switchTab('sub-tab', this)">🔔 Subscriptions</button>
        <button class="nav-btn" onclick="switchTab('config-tab', this)">⚙️ Settings</button>
    </div>

    <div class="main-content">
        <!-- DASHBOARD -->
        <div id="dashboard-tab" class="tab-content active">
            <div class="card bg-danger-card" style="color:white; text-align:center; padding: 30px;">
                <button class="download-btn" title="Download Dashboard" onclick="window.print()">⬇️</button>
                <small>Total Expense</small>
                <h1 id="total-expense">£0.00</h1>
            </div>
            
            <div class="card">
                <h3>Quick Post</h3>
                <div class="form-grid">
                    <div class="full-width"><label>Item Name</label><input type="text" id="desc" placeholder="Rent, Coffee, Bonus..."></div>
                    <div class="full-width"><label>Amount (Use - for Expense, + for Income)</label><input type="number" id="amt" placeholder="-50.00"></div>
                </div>
                <button class="btn-action bg-secondary" onclick="handleNewTransaction()">Add Record</button>
            </div>
            <div id="trans-list"></div>
        </div>

        <!-- EMI SECTION -->
        <div id="emi-tab" class="tab-content">
            <div class="hero-row">
                <div class="hero-bar bg-accent">
                    <button class="download-btn" title="Download EMI List" onclick="window.print()">⬇️</button>
                    <small>Lifetime Paid</small><h1 id="emi-history-total">£0.00</h1>
                </div>
                <div class="hero-bar bg-secondary"><small>Paid This Month</small><h1 id="emi-month-total">£0.00</h1></div>
                <div class="hero-bar bg-danger-card"><small>Left To Pay</small><h1 id="emi-remaining-total">£0.00</h1></div>
            </div>
            
            <div class="card">
                <h3 id="emi-form-title">EMI Management</h3>
                <input type="hidden" id="edit-id">
                <div class="form-grid">
                    <div class="full-width"><label>Loan Name</label><input type="text" id="e-name"></div>
                    <div><label>Total Loan Amount</label><input type="number" id="e-total"></div>
                    <div><label>Current Paid Amount</label><input type="number" id="e-paid"></div>
                    <div><label>Monthly EMI Amount</label><input type="number" id="e-monthly"></div>
                </div>
                <button class="btn-action bg-accent" onclick="handleNewEMI()">Save Loan Details</button>
                <button id="del-emi-btn" style="display:none;" class="btn-action bg-danger-card" onclick="deleteItem('emis', document.getElementById('edit-id').value); resetEMIForm();">Delete Loan</button>
            </div>

            <!-- VIEW TOGGLES ARE HERE -->
            <div class="view-toggles">
                <button class="view-btn active" onclick="setEmiView('cards', this)">Cards</button>
                <button class="view-btn" onclick="setEmiView('table', this)">Table</button>
                <button class="view-btn" onclick="setEmiView('chart', this)">Chart</button>
            </div>

            <!-- DATA DISPLAYS -->
            <div id="emi-cards-display"></div>
            <div id="emi-table-display" style="display:none; overflow-x: auto;"></div>
            <div id="emi-chart-display" class="card" style="display:none;">
                <canvas id="emiChart"></canvas>
            </div>
        </div>

        <!-- SUBSCRIPTION SECTION -->
        <div id="sub-tab" class="tab-content">
            <div class="hero-row">
                <div class="hero-bar bg-sub" style="grid-column: span 2; display: flex; flex-direction: column; justify-content: center;">
                    <button class="download-btn" title="Download Subscriptions" onclick="window.print()">⬇️</button>
                    <small>Subscription Spend</small><h1 id="sub-history-total">£0.00</h1>
                </div>
                <div class="hero-bar bg-secondary" style="display: flex; flex-direction: column; justify-content: center;">
                    <small>Current Month Subs</small><h1 id="sub-month-total">£0.00</h1>
                </div>
            </div>
            <div class="card">
                <h3>Add Subscription</h3>
                <div class="form-grid">
                    <div class="full-width"><label>Service Name</label><input type="text" id="s-name"></div>
                    <div><label>Monthly Cost</label><input type="number" id="s-amt"></div>
                    <div><label>Billing Day</label><input type="number" id="s-day"></div>
                </div>
                <button class="btn-action bg-sub" onclick="handleNewSub()">Save Subscription</button>
            </div>
            <div id="sub-display"></div>
        </div>

        <!-- SETTINGS -->
        <div id="config-tab" class="tab-content">
            <div class="card">
                <h3>Configuration</h3>
                <div class="form-grid" style="margin-bottom:20px">
                    <div><label>Active Currency</label>
                        <select id="currency-select" onchange="updateCurrency(this.value)">
                            <option value="£">GBP (£)</option>
                            <option value="$">USD ($)</option>
                            <option value="€">EUR (€)</option>
                            <option value="₹">INR (₹)</option>
                        </select>
                    </div>
                </div>
                <p>Choose Theme:</p>
                <div class="theme-grid">
                    <div class="theme-card" style="background:#fff; color:#333; border:1px solid #ddd" onclick="setTheme('default')">Light</div>
                    <div class="theme-card" style="background:#1e1e1e; color:#fff" onclick="setTheme('dark')">Dark</div>
                    <div class="theme-card" style="background:#6366f1; color:#fff" onclick="setTheme('glass')">Glass</div>
                    <div class="theme-card" style="background:#3b4252; color:#eceff4;" onclick="setTheme('nord')">Nord</div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let data = {
            transactions: JSON.parse(localStorage.getItem('f_trans')) || [],
            emis: JSON.parse(localStorage.getItem('f_emis')) || [],
            subs: JSON.parse(localStorage.getItem('f_subs')) || [],
            currency: localStorage.getItem('f_cur') || '£'
        };

        let currentEmiView = 'cards'; 
        let emiChartInstance = null;  

        function fmt(num) { return data.currency + Math.abs(parseFloat(num)).toLocaleString(undefined, {minimumFractionDigits: 2}); }

        function switchTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function setTheme(t) { document.body.className = t === 'default' ? '' : 'theme-' + t; localStorage.setItem('f_theme', t); if(currentEmiView === 'chart') renderEmiChart(); }
        setTheme(localStorage.getItem('f_theme') || 'default');
        document.getElementById('currency-select').value = data.currency;

        function setEmiView(view, btn) {
            currentEmiView = view;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById('emi-cards-display').style.display = view === 'cards' ? 'block' : 'none';
            document.getElementById('emi-table-display').style.display = view === 'table' ? 'block' : 'none';
            document.getElementById('emi-chart-display').style.display = view === 'chart' ? 'block' : 'none';

            if(view === 'chart') renderEmiChart();
        }

        function handleNewTransaction(descOverride, amtOverride) {
            const d = descOverride || document.getElementById('desc').value;
            const a = amtOverride || document.getElementById('amt').value;
            if(!d || !a) return;
            data.transactions.push({ id: Date.now(), desc: d, amt: parseFloat(a), date: new Date().toISOString() });
            if(!descOverride) { document.getElementById('desc').value = ''; document.getElementById('amt').value = ''; }
            refresh();
        }

        function handleNewEMI() {
            const n = document.getElementById('e-name').value, t = document.getElementById('e-total').value, 
                  p = document.getElementById('e-paid').value || 0, m = document.getElementById('e-monthly').value,
                  id = document.getElementById('edit-id').value;
            if(!n || !t || !m) return;
            if(id) data.emis = data.emis.filter(x => x.id != id);
            data.emis.push({ id: id || Date.now(), name: n, total: parseFloat(t), paid: parseFloat(p), monthly: parseFloat(m) });
            resetEMIForm(); refresh();
        }

        function handleNewSub() {
            const n = document.getElementById('s-name').value, a = document.getElementById('s-amt').value, d = document.getElementById('s-day').value;
            if(!n || !a) return;
            data.subs.push({ id: Date.now(), name: n, amt: parseFloat(a), day: d });
            ['s-name','s-amt','s-day'].forEach(i => document.getElementById(i).value = '');
            refresh();
        }

        function refresh() {
            localStorage.setItem('f_trans', JSON.stringify(data.transactions));
            localStorage.setItem('f_emis', JSON.stringify(data.emis));
            localStorage.setItem('f_subs', JSON.stringify(data.subs));

            const curMonth = new Date().getMonth(), curYear = new Date().getFullYear();

            let totalExp = 0;
            data.transactions.forEach(t => { if(t.amt < 0) totalExp += t.amt; });
            document.getElementById('total-expense').innerText = fmt(totalExp);

            let eHist = 0, eMonth = 0, eRemaining = 0;
            data.emis.forEach(e => {
                eHist += e.paid;
                eRemaining += (e.total - e.paid);
            });
            
            data.transactions.forEach(t => {
                let d = new Date(t.date);
                if(t.desc.startsWith("Loan:") && d.getMonth() === curMonth && d.getFullYear() === curYear) eMonth += Math.abs(t.amt);
            });
            
            document.getElementById('emi-history-total').innerText = fmt(eHist);
            document.getElementById('emi-month-total').innerText = fmt(eMonth);
            document.getElementById('emi-remaining-total').innerText = fmt(eRemaining);

            const eDisp = document.getElementById('emi-cards-display'); eDisp.innerHTML = '';
            data.emis.forEach(e => {
                const progress = Math.min((e.paid / e.total) * 100, 100).toFixed(1);
                eDisp.innerHTML += `<div class="card">
                    <button class="edit-link" onclick="editEMI(${e.id})">EDIT</button>
                    <strong>${e.name} (${progress}%)</strong>
                    <div class="progress-container"><div class="progress-fill" style="width:${progress}%"></div></div>
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <small>Remaining: ${fmt(e.total - e.paid)}</small>
                        <button class="paid-btn" onclick="payEMI(${e.id})">PAID</button>
                    </div></div>`;
            });

            renderEmiTable();
            if(currentEmiView === 'chart') renderEmiChart();

            let sHist = 0, sMonth = 0;
            data.transactions.forEach(t => {
                let d = new Date(t.date);
                if(t.desc.startsWith("Sub:")) {
                    sHist += Math.abs(t.amt);
                    if(d.getMonth() === curMonth && d.getFullYear() === curYear) sMonth += Math.abs(t.amt);
                }
            });
            document.getElementById('sub-history-total').innerText = fmt(sHist);
            document.getElementById('sub-month-total').innerText = fmt(sMonth);

            const sDisp = document.getElementById('sub-display'); sDisp.innerHTML = '';
            data.subs.forEach(s => {
                sDisp.innerHTML += `<div class="card"><div style="display:flex; justify-content:space-between">
                    <strong>${s.name} <small>(Day ${s.day})</small></strong><span>${fmt(s.amt)}</span>
                    </div><div style="margin-top:15px; display:flex; justify-content:flex-end; gap:10px;">
                    <button class="paid-btn" onclick="paySub(${s.id})">PAID</button>
                    <button class="del-btn" onclick="removeItem('subs', ${s.id})">✕</button></div></div>`;
            });

            const tList = document.getElementById('trans-list');
            tList.innerHTML = '<h3>Recent Activity</h3>';
            data.transactions.slice().reverse().forEach(t => {
                tList.innerHTML += `<div class="card" style="padding:10px; display:flex; justify-content:space-between; font-size:0.8rem">
                    <span>${t.desc}</span>
                    <div style="display:flex; gap:15px; align-items:center">
                        <b style="color:${t.amt < 0 ? '#e74c3c' : '#2ecc71'}">${fmt(t.amt)}</b>
                        <button class="del-btn" style="padding:2px 6px" onclick="removeItem('transactions', ${t.id})">✕</button>
                    </div></div>`;
            });
        }

        function renderEmiTable() {
            let html = `<table><tr><th>Loan Name</th><th>Total</th><th>Paid</th><th>Remaining</th><th>Monthly</th><th>Actions</th></tr>`;
            if (data.emis.length === 0) {
                html += `<tr><td colspan="6" style="text-align:center;">No loans added yet.</td></tr>`;
            }
            data.emis.forEach(e => {
                html += `<tr>
                    <td><strong>${e.name}</strong></td>
                    <td>${fmt(e.total)}</td>
                    <td style="color:#2ecc71">${fmt(e.paid)}</td>
                    <td style="color:#e74c3c">${fmt(e.total - e.paid)}</td>
                    <td>${fmt(e.monthly)}</td>
                    <td>
                        <button class="paid-btn" onclick="payEMI(${e.id})" style="margin-right:5px">Pay</button>
                        <button class="paid-btn" onclick="editEMI(${e.id})" style="background:#3498db">Edit</button>
                    </td>
                </tr>`;
            });
            html += `</table>`;
            document.getElementById('emi-table-display').innerHTML = html;
        }

        function renderEmiChart() {
            const ctx = document.getElementById('emiChart').getContext('2d');
            if (emiChartInstance) emiChartInstance.destroy(); 

            const textColor = getComputedStyle(document.body).getPropertyValue('--text-color').trim();

            emiChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.emis.length > 0 ? data.emis.map(e => e.name) : ['No Data'],
                    datasets: [
                        { label: 'Amount Paid', data: data.emis.length > 0 ? data.emis.map(e => e.paid) : [0], backgroundColor: '#2ecc71' },
                        { label: 'Amount Remaining', data: data.emis.length > 0 ? data.emis.map(e => e.total - e.paid) : [0], backgroundColor: '#e74c3c' }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: textColor } } },
                    scales: {
                        x: { stacked: true, ticks: { color: textColor } },
                        y: { stacked: true, ticks: { color: textColor } }
                    }
                }
            });
        }

        function payEMI(id) {
            const e = data.emis.find(x => x.id == id);
            const amt = Math.min(e.monthly, e.total - e.paid);
            if(amt <= 0) return alert("Loan fully paid!");
            e.paid += amt;
            handleNewTransaction(`Loan: ${e.name}`, -amt);
        }

        function paySub(id) {
            const s = data.subs.find(x => x.id == id);
            handleNewTransaction(`Sub: ${s.name}`, -s.amt);
        }

        function editEMI(id) {
            const e = data.emis.find(x => x.id == id);
            document.getElementById('e-name').value = e.name;
            document.getElementById('e-total').value = e.total;
            document.getElementById('e-paid').value = e.paid;
            document.getElementById('e-monthly').value = e.monthly;
            document.getElementById('edit-id').value = e.id;
            document.getElementById('emi-form-title').innerText = "Edit Loan";
            document.getElementById('del-emi-btn').style.display = "block";
            window.scrollTo(0,0);
        }

        function resetEMIForm() {
            ['e-name','e-total','e-paid','e-monthly','edit-id'].forEach(i => document.getElementById(i).value = '');
            document.getElementById('del-emi-btn').style.display = "none";
            document.getElementById('emi-form-title').innerText = "EMI Management";
        }

        function removeItem(type, id) {
            if(confirm("Confirm Delete?")) {
                data[type] = data[type].filter(x => x.id != id);
                refresh();
            }
        }

        function updateCurrency(v) { data.currency = v; localStorage.setItem('f_cur', v); refresh(); }

        refresh();
    </script>
</body>
</html>
